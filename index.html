<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Pro</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🚕 Taxi Pro</h1>
    <p>Control de ingresos y gastos</p>
  </header>

  <main>

    <!-- PASAJEROS -->
    <section id="pasajeros">
      <h2>👥 Pasajeros</h2>

      <p>
        Pasajeros de hoy:
        <strong id="totalPasajeros">0</strong>
      </p>

      <button id="btnAgregarPasajero">
        + Agregar pasajero
      </button>
    </section>

    <!-- GASTOS -->
    <section id="gastos">
      <h2>💰 Gastos</h2>

      <div id="listaGastos">
        <p>No hay gastos registrados.</p>
      </div>

      <button id="btnAgregarGasto">
        + Agregar gasto
      </button>
    </section>

    <!-- RESUMEN -->
    <section id="resumen">
      <h2>📊 Resumen del día</h2>

      <p>
        Ingresos:
        <strong id="ingresos">$0.00</strong>
      </p>

      <p>
        Gastos:
        <strong id="gastosTotales">$0.00</strong>
      </p>

      <p>
        Ganancia:
        <strong id="ganancia">$0.00</strong>
      </p>
    </section>

  </main>

  <footer>
    <p>Taxi Pro © 2026</p>
  </footer>

</body>
</html>
